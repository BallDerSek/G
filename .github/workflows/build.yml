name: Build Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Dockerfile
        run: |
          cat <<'EOF' > Dockerfile
          FROM php:8.2-cli-alpine

          WORKDIR /workspace

          RUN apk add --no-cache \
              curl \
              git \
              unzip \
              ca-certificates \
              imagemagick \
              python3 \
              py3-pip \
              nodejs \
              npm \
              tesseract-ocr \
              freetype \
              libpng \
              libjpeg-turbo \
              freetype-dev \
              libpng-dev \
              libjpeg-turbo-dev \
              && docker-php-ext-configure gd --with-freetype --with-jpeg \
              && docker-php-ext-install gd

          RUN npm install -g deobfuscator synchrony

          ENV CI=1
          EOF

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/71:latest"
          docker build -t $IMAGE_NAME .

      - name: Check versions
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/71:latest php -r "echo 'PHP: ' . PHP_VERSION . PHP_EOL; echo 'cURL: ' . curl_version()['version'] . PHP_EOL; echo 'SSL: ' . curl_version()['ssl_version'] . PHP_EOL; echo 'Libz: ' . curl_version()['libz_version'] . PHP_EOL;"

      - name: Push
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/71:latest"
          docker push $IMAGE_NAME
          echo "Image ready: $IMAGE_NAME"
