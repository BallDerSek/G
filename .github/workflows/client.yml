name: Client Runner

on:
  workflow_dispatch:
    inputs:
      bot:
        description: 'bot'
        default: 'shortlink'
        required: true
      login:
        description: '["user1","user2"]'
        default: '["0"]'
        required: true
      mail:
        description: '["a@x.com","b@y.com"]'
        default: '["0"]'
        required: true
      pass:
        description: 'Password (opsional, default ambil dari secrets)'
        required: false
      api:
        type: choice
        options: [solverify, tertuyul, xevil, skibidixxx, capsolver, multibot, gmxch]
        required: true
      key:
        description: 'Manual API Key (kalo kosong pakai secrets)'
        required: false
      proxy:
        description: '["socks5://u:p@ip:port"]'
        default: '[""]'
        required: false
      matrix_source:
        type: choice
        options: [login, mail]
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.zip.outputs.pairs }}
    steps:
      - id: zip
        shell: python3
        env:
          SOURCE: ${{ github.event.inputs.matrix_source }}
          LOGIN:  ${{ github.event.inputs.login }}
          MAIL:   ${{ github.event.inputs.mail }}
          PROXY:  ${{ github.event.inputs.proxy }}
        run: |
          import json, os

          # cek source matrix
          src = os.getenv("SOURCE")
          try:
              logins = json.loads(os.getenv("LOGIN", "[]"))
              mails  = json.loads(os.getenv("MAIL", "[]"))
              proxies= json.loads(os.getenv("PROXY", "[]"))
          except Exception as e:
              print(f"Error parsing JSON: {e}")
              exit(1)

          arr = []
          # cek proxy kosong
          clean_proxies = [p for p in proxies if p and p.strip()]

          if not clean_proxies:
              if src == "login":
                  arr = [{"login": l, "proxy": ""} for l in logins]
              else:
                  arr = [{"mail": m, "proxy": ""} for m in mails]
          else:
              # tes pake zip biar jumlah matrix sesuai item terkecil 
              if src == "login":
                  arr = [{"login": l, "proxy": p} for l, p in zip(logins, clean_proxies)]
              else:
                  arr = [{"mail": m, "proxy": p} for m, p in zip(mails, clean_proxies)]

          # docs baru katanya (github output file)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"pairs={json.dumps(arr)}\n")

  run:
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.pairs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.pairs) }}

    steps:
      - name: Clone Engine
        run: |
          git clone https://github.com/gmxch/71.git engine
          cp -r engine/. .
          rm -rf engine
        shell: bash

      - name: Setup deps
        uses: ./.github/actions/deps
        continue-on-error: false

      - name: Setup Keys
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.key }}" ]; then
            echo "KEY=${{ github.event.inputs.key }}" >> "$GITHUB_ENV"
          else
            case "${{ github.event.inputs.api }}" in
              solverify)  echo "KEY=${{ secrets.SOLVERIFY }}" >> "$GITHUB_ENV" ;;
              tertuyul)   echo "KEY=${{ secrets.TERTUYUL }}" >> "$GITHUB_ENV" ;;
              xevil)      echo "KEY=${{ secrets.XEVIL }}" >> "$GITHUB_ENV" ;;
              skibidixxx) echo "KEY=${{ secrets.SKIBIDI }}" >> "$GITHUB_ENV" ;;
              capsolver)  echo "KEY=${{ secrets.CAPSOLVER }}" >> "$GITHUB_ENV" ;;
              multibot)   echo "KEY=${{ secrets.MULTIBOT }}" >> "$GITHUB_ENV" ;;
              gmxch)      echo "KEY=${{ secrets.GMXCH }}" >> "$GITHUB_ENV" ;;
              *)          echo "KEY=" >> "$GITHUB_ENV" ;;
            esac
          fi

      - name: Start php
        run: php run.php
        env:
          CI: "1"
          _authApi_: ${{ secrets.AUTH }}
          DG: ${{ secrets.DG }}
          BOT: ${{ github.event.inputs.bot }}
          API: ${{ github.event.inputs.api }}
          KEY: ${{ env.KEY }}
          PROXY: ${{ matrix.proxy }}
          login: ${{ matrix.login }}
          mail: ${{ matrix.mail }}
          pass: ${{ github.event.inputs.pass || secrets.PASS }}
