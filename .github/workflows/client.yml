name: Client Runner

on:
  workflow_dispatch:
    inputs:
      bot:
        description: 'bot'
        default: 'shortlink'
        required: true
      login:
        description: '["user1","user2"]'
        default: '["0"]'
        required: true
      mail:
        description: '["a@x.com","b@y.com"]'
        default: '["0"]'
        required: true
      pass:
        description: 'pass'
        required: false
      api:
        type: choice
        options: [tertuyul, xevil, skibidixxx, capsolver, multibot, solverify, gmxch]
        required: true
      key:
        description: 'key'
        required: false
      proxy:
        description: '["http://u:p@ip:port"]'
        default: '[""]'
        required: false
      matrix_source:
        type: choice
        options: [login, mail]
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.zip.outputs.pairs }}
    steps:
      - id: zip
        shell: python {0}
        env:
          SOURCE: ${{ github.event.inputs.matrix_source }}
          LOGIN:  ${{ github.event.inputs.login }}
          MAIL:   ${{ github.event.inputs.mail }}
        run: |
          import json, os
          src = os.getenv("SOURCE")
          logins = json.loads(os.getenv("LOGIN", "[]"))
          mails  = json.loads(os.getenv("MAIL", "[]"))
          targets = logins if src == "login" else mails
          valid_targets = [t for t in targets if str(t) != "0"]
          arr = []
          for i, item in enumerate(valid_targets):
              arr.append({src: item, "p_idx": i})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"pairs={json.dumps(arr)}\n")

  run:
    needs: prepare
    if: needs.prepare.outputs.pairs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.pairs) }}

    steps:
      - name: Clone Engine
        run: |
          git clone https://github.com/gmxch/71.git engine
          cp -r engine/. .
          rm -rf engine
        shell: bash

      - name: Setup deps
        uses: ./.github/actions/deps
        continue-on-error: false

      - name: Start php
        shell: python {0}
        env:
          # --- INPUTS ---
          MAIL_VAL: ${{ matrix.mail || matrix.login }}
          P_INDEX: ${{ matrix.p_idx }}
          RAW_PROXIES: ${{ github.event.inputs.proxy }}
          API_CHOICE: ${{ github.event.inputs.api }}
          KEY_INPUT: ${{ github.event.inputs.key }}
          PASS_INPUT: ${{ github.event.inputs.pass }}
          BOT_INPUT: ${{ github.event.inputs.bot }}
          
          # --- SECRETS ---
          SEC_MAIL_LIST: ${{ secrets.MAIL_LIST }}
          SEC_PROXY_LIST: ${{ secrets.PROXY_LIST }}
          SEC_PASS: ${{ secrets.PASS }}
          SEC_AUTH: ${{ secrets.AUTH }}
          SEC_DG: ${{ secrets.DG }}
          S_SOLVERIFY: ${{ secrets.SOLVERIFY }}
          S_TERTUYUL: ${{ secrets.TERTUYUL }}
          S_XEVIL: ${{ secrets.XEVIL }}
          S_SKIBIDI: ${{ secrets.SKIBIDI }}
          S_CAPSOLVER: ${{ secrets.CAPSOLVER }}
          S_MULTIBOT: ${{ secrets.MULTIBOT }}
          S_GMXCH: ${{ secrets.GMXCH }}
          
        run: |
          import os, json, subprocess

          # Load Proxies
          proxies = json.loads(os.getenv("RAW_PROXIES", "[]"))
          idx = int(os.getenv("P_INDEX", "0"))
          real_proxy = proxies[idx] if idx < len(proxies) else ""

          # Handle API Keys
          api_type = os.getenv("API_CHOICE")
          manual_key = os.getenv("KEY_INPUT")
          secrets_map = {
              "solverify": os.getenv("S_SOLVERIFY"),
              "tertuyul": os.getenv("S_TERTUYUL"),
              "xevil": os.getenv("S_XEVIL"),
              "skibidixxx": os.getenv("S_SKIBIDI"),
              "capsolver": os.getenv("S_CAPSOLVER"),
              "multibot": os.getenv("S_MULTIBOT"),
              "gmxch": os.getenv("S_GMXCH")
          }
          final_key = manual_key if (manual_key and manual_key.strip()) else secrets_map.get(api_type, "")

          # Prepare Environment for PHP
          php_env = os.environ.copy()
          php_env["CI"] = "1"
          php_env["DG"] = os.getenv("SEC_DG", "1")
          php_env["PROXY"] = real_proxy
          php_env["mail"] = os.getenv("MAIL_VAL")
          php_env["login"] = os.getenv("MAIL_VAL")
          php_env["KEY"] = final_key
          php_env["pass"] = os.getenv("PASS_INPUT") if os.getenv("PASS_INPUT") else os.getenv("SEC_PASS")
          php_env["_authApi_"] = os.getenv("SEC_AUTH")
          php_env["BOT"] = os.getenv("BOT_INPUT")
          php_env["MAIL_LIST"] = os.getenv("SEC_MAIL_LIST", "")
          php_env["PROXY_LIST"] = os.getenv("SEC_PROXY_LIST", "")

          print(f" Running {php_env['BOT']}")
          
          # Execute
          subprocess.run(["php", "run.php"], env=php_env)
