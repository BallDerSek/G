name: Runner Multi Batch Easy

on:
  workflow_dispatch:
    inputs:
      bot:
        description: 'bott'
        default: 'shortlink'
        required: true
      accounts_list:
        description: 'list'
        required: true
      api:
        type: choice
        options: [tertuyul, xevil, skibidixxx, capsolver, multibot, solverify, gmxch]
        required: true
      matrix_source:
        description: 'type'
        type: choice
        options: [login, mail]
        default: 'mail'
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.set-batches.outputs.batches }}
    steps:
      - id: set-batches
        shell: python {0}
        env:
          RAW_ACCOUNTS: ${{ github.event.inputs.accounts_list }}
        run: |
          import os, json
          raw = os.getenv("RAW_ACCOUNTS", "")
          targets = [line.strip() for line in raw.splitlines() if line.strip()]
          
          batch_size = 10
          matrix_data = []
          for i in range(0, len(targets), batch_size):
              batch = targets[i:i + batch_size]
              matrix_data.append({"accounts": batch, "offset": i})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"batches={json.dumps(matrix_data)}\n")

  run-all:
    needs: prepare
    if: needs.prepare.outputs.batches != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.batches) }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup deps
        uses: ./.github/actions/deps
        continue-on-error: false

      - name: Start Batch Parallel
        shell: python {0}
        env:
          # --- DATA ---
          CURRENT_BATCH: ${{ json.dumps(matrix.accounts) }}
          OFFSET: ${{ matrix.offset }}
          LIST_PROXY: ${{ secrets.PROXY_LIST }}
          
          # --- INPUTS & SECRETS ---
          API_CHOICE: ${{ github.event.inputs.api }}
          BOT_INPUT: ${{ github.event.inputs.bot }}
          SEC_PASS: ${{ secrets.PASS }}
          SEC_AUTH: ${{ secrets.AUTH }}
          SEC_DG: ${{ secrets.DG }}
          S_SOLVERIFY: ${{ secrets.SOLVERIFY }}
          S_TERTUYUL: ${{ secrets.TERTUYUL }}
          S_XEVIL: ${{ secrets.XEVIL }}
          S_SKIBIDI: ${{ secrets.SKIBIDI }}
          S_CAPSOLVER: ${{ secrets.CAPSOLVER }}
          S_MULTIBOT: ${{ secrets.MULTIBOT }}
          S_GMXCH: ${{ secrets.GMXCH }}

        run: |
          import os, json, subprocess
          from concurrent.futures import ThreadPoolExecutor

          def get_list(env_name):
              raw = os.getenv(env_name, "")
              return [line.strip() for line in raw.splitlines() if line.strip()]

          accounts = json.loads(os.getenv("CURRENT_BATCH", "[]"))
          proxies = get_list("LIST_PROXY")
          offset = int(os.getenv("OFFSET", "0"))

          def run_worker(target, local_idx):
              global_idx = offset + local_idx
              raw_target = str(target)
              
              api_type = os.getenv("API_CHOICE", "").lower()
              secrets_map = {
                  "solverify": os.getenv("S_SOLVERIFY"),
                  "tertuyul": os.getenv("S_TERTUYUL"),
                  "xevil": os.getenv("S_XEVIL"),
                  "skibidixxx": os.getenv("S_SKIBIDI"),
                  "capsolver": os.getenv("S_CAPSOLVER"),
                  "multibot": os.getenv("S_MULTIBOT"),
                  "gmxch": os.getenv("S_GMXCH")
              }
              
              final_key = secrets_map.get(api_type, "")
              real_proxy = proxies[global_idx] if global_idx < len(proxies) else ""

              php_env = os.environ.copy()
              php_env.update({
                  "CI": "1",
                  "DG": os.getenv("SEC_DG", "1"),
                  "PROXY": real_proxy,
                  "mail": raw_target,
                  "login": raw_target,
                  "KEY": final_key,
                  "API": api_type,
                  "pass": os.getenv("SEC_PASS", ""),
                  "_authApi_": os.getenv("SEC_AUTH", ""),
                  "BOT": os.getenv("BOT_INPUT", "")
              })

              print(f"[*] [Acc-{global_idx}] Starting: {raw_target}")
              subprocess.run(["php", "run.php"], env=php_env)
              print(f"[!] [Acc-{global_idx}] Finished: {raw_target}")

          with ThreadPoolExecutor(max_workers=len(accounts)) as executor:
              for i, t in enumerate(accounts):
                  executor.submit(run_worker, t, i)
