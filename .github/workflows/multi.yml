name: Multi Runner

on:
  workflow_dispatch:
    inputs:
      bot: { default: onlyfans, required: true }
      accounts: { default: '["0"]', required: true }
      pass: { required: false }
      api:
        type: choice
        options: [tertuyul, xevil, skibidixxx, capsolver, multibot, solverify, gmxch]
        required: true
      key: { required: false }
      proxy: { default: '[""]', required: false }

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.split.outputs.batches }}

    steps:
      - id: split
        shell: python
        env:
          ACCOUNTS: ${{ github.event.inputs.accounts }}
        run: |
          import json, os

          try:
              data = json.loads(os.getenv("ACCOUNTS","[]"))
          except:
              data = []

          data = [x for x in data if str(x) != "0"]

          size = 10
          batches = []

          for i in range(0, len(data), size):
              batches.append({
                  "chunk_str": json.dumps(data[i:i+size]),
                  "offset": i
              })

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"batches={json.dumps(batches)}\n")

  run:
    needs: prepare
    if: needs.prepare.outputs.batches != '[]'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/gmxch/71:latest

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.batches) }}

    steps:
      - name: Clone repo
        run: git clone https://github.com/BallDerSek/G .

      - name: Run worker
        working-directory: .
      
        env:
          CHUNK_RAW: ${{ matrix.chunk_str }}
          OFFSET: ${{ matrix.offset }}

          RAW_PROXIES: ${{ github.event.inputs.proxy }}
          API_CHOICE: ${{ github.event.inputs.api }}
          KEY_INPUT: ${{ github.event.inputs.key }}
          PASS_INPUT: ${{ github.event.inputs.pass }}
          BOT_INPUT: ${{ github.event.inputs.bot }}

          SEC_PASS: ${{ secrets.PASS }}
          SEC_AUTH: ${{ secrets.AUTH }}
          SEC_DG: ${{ secrets.DG }}

          S_SOLVERIFY: ${{ secrets.SOLVERIFY }}
          S_TERTUYUL: ${{ secrets.TERTUYUL }}
          S_XEVIL: ${{ secrets.XEVIL }}
          S_SKIBIDI: ${{ secrets.SKIBIDI }}
          S_CAPSOLVER: ${{ secrets.CAPSOLVER }}
          S_MULTIBOT: ${{ secrets.MULTIBOT }}
          S_GMXCH: ${{ secrets.GMXCH }}

        run: |
          python3 - << 'EOF'
          import os, json, subprocess
          from concurrent.futures import ThreadPoolExecutor

          accounts = json.loads(os.getenv("CHUNK_RAW","[]"))
          proxies = json.loads(os.getenv("RAW_PROXIES","[]"))
          offset = int(os.getenv("OFFSET","0"))

          api_type = os.getenv("API_CHOICE","").lower()
          manual_key = os.getenv("KEY_INPUT","").strip()

          def run_worker(target, i):
              idx = offset + i
              proxy = proxies[idx] if idx < len(proxies) else ""

              clean = str(target).strip().replace('"','').replace("'",'')

              keys = {
                  "solverify": os.getenv("S_SOLVERIFY"),
                  "tertuyul": os.getenv("S_TERTUYUL"),
                  "xevil": os.getenv("S_XEVIL"),
                  "skibidixxx": os.getenv("S_SKIBIDI"),
                  "capsolver": os.getenv("S_CAPSOLVER"),
                  "multibot": os.getenv("S_MULTIBOT"),
                  "gmxch": os.getenv("S_GMXCH")
              }

              key = manual_key or keys.get(api_type,"")

              env = os.environ.copy()
              env.update({
                  "CI": "1",
                  "AN": "0",
                  "BOT": os.getenv("BOT_INPUT",""),
                  
                  "mail": clean,
                  "login": clean,
                  "pass": (os.getenv("PASS_INPUT") or os.getenv("SEC_PASS", "")).strip(),
                  
                  "KEY": key,
                  "API": api_type,
                  "_authApi_": os.getenv("SEC_AUTH", ""),
                  
                  "PROXY": proxy,
              })

              subprocess.run(["php","run.php"], env=env)

          with ThreadPoolExecutor(max_workers=10) as ex:
              for i,a in enumerate(accounts):
                  ex.submit(run_worker,a,i)
          EOF
